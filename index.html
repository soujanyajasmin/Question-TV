<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question TV</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <button class="menu-button">☰</button>
        <h1>QUESTION TV</h1>
    </header>

    <!-- MAIN PAGE -->
    <main class="main-container">

        <!-- PREVIOUS MONTH -->
        <aside class="previous-section">
            <h2>Previous Month</h2>
            <div class="previous-box">
                <h3>August</h3>
                <p id="previousMonthText">Previous month data</p>
                <button id="previousMonthButton">View Data</button>
            </div>
        </aside>

        <!-- CURRENT DATA -->
        <section class="current-section">
            <h2 id="sectionTitle">Current Day</h2>

            <!-- BUCKETS NAVIGATION (Single Oval Display) -->
            <div class="bucket-area">
                <button class="arrow-button" id="previousButton">←</button>

                <div class="bucket active" id="activeBucket">
                    Question 1
                </div>

                <button class="arrow-button" id="nextButton">→</button>
            </div>

            <!-- SELECTED CONTENT -->
            <div class="selected-content">
                <h2 id="contentHeading">Artificial Intelligence</h2>

                <div class="content-image">
                    <img id="contentImage" src="https://images.pexels.com/photos/8566467/pexels-photo-8566467.jpeg" alt="Question Image">
                </div>

                <p id="contentDescription">
                    Artificial Intelligence is a field of computer science that focuses on creating systems that can perform tasks that normally require human intelligence.
                </p>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
